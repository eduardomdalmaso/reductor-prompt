[package]
name = "reductor-rs"
version = "0.1.0"
edition = "2021"
description = "ReductorPrompt Native Core in Rust - High Performance & Zero-Leak Prompt Optimization"
authors = ["ReductorPrompt Team"]

[dependencies]
# Concorrência e Async Runtime
tokio = { version = "1.38", features = ["full"] }
rayon = "1.10"
futures = "0.3"

# CLI & Terminal UI
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
indicatif = { version = "0.17", features = ["rayon"] }

# HTTP & API Framework (Axum)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialização & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Criptografia, Hashing & Regex
sha2 = "0.10"
regex = "1.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Leitura e Extração de Documentos
lopdf = "0.33"
walkdir = "2.5"

# Configurações de Ambiente
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3.10"
