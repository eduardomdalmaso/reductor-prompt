version: '3.8'

services:
  chromadb:
    image: docker.io/chromadb/chroma:latest
    container_name: reductor_chromadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./storage/chroma:/chroma/chroma:Z
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: reductor_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    security_opt:
      - label=disable
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    volumes:
      - ./storage/ollama:/root/.ollama:Z
      - /usr/lib64/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - /usr/lib64/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      - /usr/lib64/libnvidia-ptxjitcompiler.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:ro
      - /usr/lib64/libnvidia-ptxjitcompiler.so.1:/usr/lib/ollama/cuda_v13/libnvidia-ptxjitcompiler.so.1:ro
      - /usr/lib64/libnvidia-ptxjitcompiler.so.1:/usr/lib/ollama/cuda_v12/libnvidia-ptxjitcompiler.so.1:ro
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
